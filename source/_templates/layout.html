{%- extends "!layout.html" %}
{#- Link each page to the same page in the other language. Pages sit at the top level,
    so the Japanese build lives one directory down, in ja/. -#}
{%- block header %}
<div class="lang-switch">
  {%- if language == 'ja' %}
  <a href="../{{ pagename }}{{ file_suffix }}" hreflang="en" lang="en">English</a>
  {%- else %}
  <a href="ja/{{ pagename }}{{ file_suffix }}" hreflang="ja" lang="ja">日本語</a>
  {%- endif %}
</div>
{%- endblock %}
