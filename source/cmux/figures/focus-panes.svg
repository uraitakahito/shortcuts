<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 344" width="852" height="344">
<style>
.bg { fill: #ffffff; stroke: #dbdfe6; }
text { fill: #161a20; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif; font-size: 12.5px; }
.term, .term-p, .vim { font-family: "SFMono-Regular", Menlo, monospace; }
.term { font-size: 12.5px; } .term-p { font-size: 12px; } .vim { font-size: 10.5px; }
.box { fill: #ffffff; stroke: #4b5361; stroke-width: 1; }
.box.on { stroke: #1d55cc; stroke-width: 1.5; }
.edge { fill: none; stroke: #4b5361; stroke-width: 1.25; }
.edge.on { stroke: #1d55cc; stroke-width: 1.75; }
.arrowhead { fill: #4b5361; } .arrowhead.on { fill: #1d55cc; }
.box-t { font-size: 13px; font-weight: 600; }
.box-n, .arrow-t, .cap-n { font-size: 11.5px; fill: #4b5361; } .cap-n { font-size: 11px; }
.key { font-size: 12px; font-weight: 600; fill: #1d55cc; letter-spacing: 0.04em; }
.key-ink { font-size: 12px; font-weight: 500; letter-spacing: 0.04em; }
.pane { fill: #f7f8fa; stroke: #4b5361; stroke-width: 1; }
.sel { fill: #c0cff1; }
.ptr { fill: #161a20; stroke: #ffffff; stroke-width: 1.2; stroke-linejoin: round; }
.store { fill: #edf1fb; stroke: #1d55cc; stroke-width: 1.25; }
.vim-badge { fill: #e8e8e9; stroke: #4b5361; stroke-width: 0.8; }
.k { font-weight: 600; fill: #1d55cc; } .k-ink { font-weight: 600; }
.keycap { fill: #ffffff; stroke: #1d55cc; stroke-width: 1.25; }
.keycap-ink { fill: #ffffff; stroke: #4b5361; stroke-width: 1; }
.cap-s { font-size: 19px; font-weight: 500; } .cap-s.on { fill: #1d55cc; }
.plus { font-size: 18px; fill: #4b5361; }
.tab-t { font-size: 11.5px; font-weight: 600; }
.tabbar { fill: #f1f1f2; }
.sidebar { fill: #f3f4f4; stroke: #4b5361; stroke-width: 1; }
.ws-row { fill: #eaeaeb; } .ws-row.on { fill: #bbccf0; }
.line-ph { fill: #dedfe0; }
.addr { fill: #ffffff; stroke: #4b5361; stroke-width: 0.8; }
.focus-ring { fill: none; stroke: #1d55cc; stroke-width: 3; }
.badge-c { fill: #1d55cc; } .badge-ink { fill: #4b5361; }
.badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
.arc-t { font-size: 13.5px; }
.cursor { fill: #161a20; }
</style>
<rect class="bg" x="0.5" y="0.5" width="851" height="343" rx="10"/>
<g transform="translate(16 16)">
<defs><marker id="a-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead on" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<rect class="sidebar" x="20" y="14" width="150" height="232" rx="8"/>
<text class="box-n" x="95" y="38" text-anchor="middle">Sidebar</text>
<rect class="ws-row" x="34" y="54" width="122" height="22" rx="5"/>
<rect class="ws-row" x="34" y="84" width="122" height="22" rx="5"/>
<rect class="ws-row on" x="34" y="114" width="122" height="22" rx="5"/>
<rect class="ws-row" x="34" y="144" width="122" height="22" rx="5"/>
<rect class="ws-row" x="34" y="174" width="122" height="22" rx="5"/>
<rect class="box" x="180" y="14" width="300" height="232" rx="8"/>
<rect class="tabbar" x="181" y="15" width="298" height="28" rx="7"/>
<circle class="badge-ink" cx="199" cy="29" r="9"/>
<text class="badge" x="199" y="33" text-anchor="middle">1</text>
<text class="tab-t" x="215" y="33">Terminal (Claude Code)</text>
<text class="key-ink" x="466" y="33" text-anchor="end">⌃⌘1</text>
<rect class="line-ph" x="198" y="62" width="230" height="8" rx="4"/>
<rect class="line-ph" x="198" y="80" width="190" height="8" rx="4"/>
<rect class="line-ph" x="198" y="98" width="250" height="8" rx="4"/>
<rect class="line-ph" x="198" y="116" width="160" height="8" rx="4"/>
<rect class="line-ph" x="198" y="134" width="210" height="8" rx="4"/>
<text class="term-p" x="198" y="216">❯</text>
<rect class="cursor" x="212" y="205" width="7" height="14"/>
<rect class="box" x="490" y="14" width="310" height="232" rx="8"/>
<rect class="tabbar" x="491" y="15" width="308" height="28" rx="7"/>
<circle class="badge-c" cx="509" cy="29" r="9"/>
<text class="badge" x="509" y="33" text-anchor="middle">2</text>
<text class="tab-t" x="525" y="33">Browser</text>
<text class="key-ink" x="786" y="33" text-anchor="end">⌃⌘2</text>
<rect class="addr" x="506" y="54" width="278" height="20" rx="10"/>
<rect class="line-ph" x="508" y="92" width="240" height="8" rx="4"/>
<rect class="line-ph" x="508" y="110" width="270" height="8" rx="4"/>
<rect class="line-ph" x="508" y="128" width="200" height="8" rx="4"/>
<rect class="line-ph" x="508" y="146" width="250" height="8" rx="4"/>
<text class="box-n" x="645" y="206" text-anchor="middle">Current focus (blue frame)</text>
<rect class="focus-ring" x="490" y="14" width="310" height="232" rx="8"/>
<path class="edge on" d="M645 252 C645 292, 330 292, 330 256" marker-end="url(#a-on)"/>
<text class="arc-t" x="488" y="306" text-anchor="middle">Press <tspan class="k">⌘⌥←</tspan> to move to the left pane</text>
</g>
</svg>
