<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 302" width="852" height="302">
<style>
.bg { fill: #ffffff; stroke: #dbdfe6; }
text { fill: #161a20; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif; font-size: 12.5px; }
.term, .term-p, .vim { font-family: "SFMono-Regular", Menlo, monospace; }
.term { font-size: 12.5px; } .term-p { font-size: 12px; } .vim { font-size: 10.5px; }
.box { fill: #ffffff; stroke: #4b5361; stroke-width: 1; }
.box.on { stroke: #1d55cc; stroke-width: 1.5; }
.edge { fill: none; stroke: #4b5361; stroke-width: 1.25; }
.edge.on { stroke: #1d55cc; stroke-width: 1.75; }
.arrowhead { fill: #4b5361; } .arrowhead.on { fill: #1d55cc; }
.box-t { font-size: 13px; font-weight: 600; }
.box-n, .arrow-t, .cap-n { font-size: 11.5px; fill: #4b5361; } .cap-n { font-size: 11px; }
.key { font-size: 12px; font-weight: 600; fill: #1d55cc; letter-spacing: 0.04em; }
.key-ink { font-size: 12px; font-weight: 500; letter-spacing: 0.04em; }
.pane { fill: #f7f8fa; stroke: #4b5361; stroke-width: 1; }
.sel { fill: #c0cff1; }
.ptr { fill: #161a20; stroke: #ffffff; stroke-width: 1.2; stroke-linejoin: round; }
.store { fill: #edf1fb; stroke: #1d55cc; stroke-width: 1.25; }
.vim-badge { fill: #e8e8e9; stroke: #4b5361; stroke-width: 0.8; }
.k { font-weight: 600; fill: #1d55cc; } .k-ink { font-weight: 600; }
.keycap { fill: #ffffff; stroke: #1d55cc; stroke-width: 1.25; }
.keycap-ink { fill: #ffffff; stroke: #4b5361; stroke-width: 1; }
.cap-s { font-size: 19px; font-weight: 500; } .cap-s.on { fill: #1d55cc; }
.plus { font-size: 18px; fill: #4b5361; }
.tab-t { font-size: 11.5px; font-weight: 600; }
.tabbar { fill: #f1f1f2; }
.sidebar { fill: #f3f4f4; stroke: #4b5361; stroke-width: 1; }
.ws-row { fill: #eaeaeb; } .ws-row.on { fill: #bbccf0; }
.line-ph { fill: #dedfe0; }
.addr { fill: #ffffff; stroke: #4b5361; stroke-width: 0.8; }
.focus-ring { fill: none; stroke: #1d55cc; stroke-width: 3; }
.badge-c { fill: #1d55cc; } .badge-ink { fill: #4b5361; }
.badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
.arc-t { font-size: 13.5px; }
.cursor { fill: #161a20; }
</style>
<rect class="bg" x="0.5" y="0.5" width="851" height="301" rx="10"/>
<g transform="translate(16 16)">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="a-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead on" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<rect class="box" x="20" y="20" width="140" height="230" rx="8"/>
<text class="box-t" x="90" y="131" text-anchor="middle">マウスで選ぶ</text>
<text class="box-n" x="90" y="151" text-anchor="middle">ドラッグなど</text>
<line class="edge" x1="160" y1="56" x2="328" y2="56" marker-end="url(#a)"/>
<text class="arrow-t" x="244" y="47" text-anchor="middle">選ぶだけで入る</text>
<line class="edge on" x1="160" y1="214" x2="328" y2="214" marker-end="url(#a-on)"/>
<text class="key" x="244" y="205" text-anchor="middle">⌘C</text>
<text class="arrow-t" x="244" y="234" text-anchor="middle">設定で自動にもできる</text>
<rect class="box" x="330" y="20" width="230" height="72" rx="8"/>
<text class="box-t" x="445" y="51" text-anchor="middle">cmux の選択用の置き場</text>
<text class="box-n" x="445" y="71" text-anchor="middle">cmux の中だけで使う</text>
<rect class="store" x="330" y="178" width="230" height="72" rx="8"/>
<text class="box-t" x="445" y="209" text-anchor="middle">クリップボード</text>
<text class="box-n" x="445" y="229" text-anchor="middle">macOS のアプリで共通</text>
<line class="edge" x1="560" y1="56" x2="668" y2="56" marker-end="url(#a)"/>
<text class="key-ink" x="614" y="47" text-anchor="middle">⌘⇧V</text>
<text class="arrow-t" x="614" y="75" text-anchor="middle">中クリック</text>
<line class="edge on" x1="560" y1="214" x2="668" y2="214" marker-end="url(#a-on)"/>
<text class="key" x="614" y="205" text-anchor="middle">⌘V</text>
<rect class="box" x="670" y="20" width="130" height="72" rx="8"/>
<text class="box-t" x="735" y="51" text-anchor="middle">cmux に貼る</text>
<text class="box-n" x="735" y="71" text-anchor="middle">ターミナルの中</text>
<rect class="box" x="670" y="178" width="130" height="72" rx="8"/>
<text class="box-t" x="735" y="209" text-anchor="middle">どこにでも貼る</text>
<text class="box-n" x="735" y="229" text-anchor="middle">ほかのアプリにも</text>
</g>
</svg>
