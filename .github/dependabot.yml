version: 2
updates:
  # ワークフローが参照する Action のメジャー更新を PR で知らせる
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # uv.lock の依存を毎週まとめて上げる。セキュリティの修正も 1 本にまとめる
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-packages:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
