name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# main へのデプロイは直列・中断なし。PR のビルドは新しい push が来たら古いものを中断
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # v10 のような浮動メジャータグは無いので完全版で固定
      - run: uv sync --locked                                 # uv.lock どおりに入れる。ずれていたら失敗
      - run: uv run make html SPHINXOPTS="-W --keep-going"   # 警告をエラーにし、全部出してから止まる
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

  deploy:
    if: github.event_name != 'pull_request'   # PR ではビルドだけ。push と手動実行で配信
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
